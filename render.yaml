services:
  - type: web
    name: floodlens
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FLOODLENS_ENV
        value: production
      - key: FLOODLENS_HOST
        value: 0.0.0.0
      - key: FLOODLENS_HSTS
        value: "1"
      - key: FLOODLENS_TRUST_PROXY
        value: "1"
