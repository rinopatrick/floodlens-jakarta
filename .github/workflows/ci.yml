name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Python lint
        run: python -m ruff check .

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: JavaScript unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build container image
        run: docker build -t floodlens:ci .
      - name: Smoke container health
        run: |
          docker run -d --rm --name floodlens-ci -p 8766:8766 floodlens:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8766/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8766/healthz | grep -q '"status":"ok"'
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8766/readyz | grep -Eq "200|503"
          curl -s http://127.0.0.1:8766/readyz | grep -q '"status":"warming"'
          curl -fsS http://127.0.0.1:8766/metrics | grep -q floodlens_cache_age_seconds
          docker stop floodlens-ci
